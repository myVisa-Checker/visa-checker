<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://visa-chat.rabehfly.workers.dev; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Host &amp; Go — Voyageur / Worker</title>
<meta name="description" content="Host &amp; Go pour les voyageurs et workers : formules, création de compte et étapes pour rejoindre la communauté.">
<meta name="theme-color" content="#0b2257">
<link rel="canonical" href="https://checkmyvisa.org/hostgo-voyageur.html">
<link rel="stylesheet" href="./nav.css">
<link rel="stylesheet" href="./site.css">
<link rel="stylesheet" href="./brand.css">
<link rel="stylesheet" href="./hostgo-hote.css">
<link rel="stylesheet" href="./hostgo-voyageur.css">
<script src="./site-i18n.js"></script>
<script src="./i18n/common.js"></script>
</head>
<body>
<main id="hgh" data-no-i18n>
  <header class="hgh-top">
    <a class="hgh-brand" href="./hostgo.html" aria-label="Host &amp; Go"><span class="hgh-mark" aria-hidden="true">⌂</span><span>Host <em>&amp;</em> Go</span></a>
    <a class="hgh-back-link" href="./hostgo.html" data-i="backHome">Retour à Host &amp; Go</a>
  </header>
  <div class="hgh-wrap">
    <div class="hgh-progress" role="img" aria-label="" id="hgh-progress"></div>

    <section class="hgh-step" id="pl" aria-labelledby="h-pl">
      <div class="hgh-head">
        <p class="hgh-eyebrow" data-i="eb_pl"></p>
        <h1 id="h-pl" data-i="h_pl"></h1>
        <p data-i="lead_pl"></p>
      </div>
      <div class="hgv-toggle" role="group" aria-label="" id="plan-group">
        <button type="button" class="hgv-opt" data-plan="solo" aria-pressed="true" data-i="solo"></button>
        <button type="button" class="hgv-opt" data-plan="couple" aria-pressed="false" data-i="couple"></button>
      </div>
      <div class="hgh-card hgv-plan">
        <h2 id="plan-name"></h2>
        <p class="hgv-price"><strong id="plan-price"></strong> <span data-i="perYear"></span></p>
        <p id="plan-for" class="hgh-note"></p>
        <h3 data-i="featH"></h3>
        <ul class="hgv-feat" id="feat"></ul>
        <p class="hgh-note" data-i="payLater"></p>
      </div>
      <div class="hgh-actions">
        <a class="hgh-btn ghost" href="./hostgo.html" data-i="back"></a>
        <button class="hgh-btn" type="button" data-go="next" data-i="join"></button>
      </div>
    </section>

    <section class="hgh-step" id="ac" hidden aria-labelledby="h-ac">
      <div class="hgh-head">
        <p class="hgh-eyebrow" data-i="eb_ac"></p>
        <h1 id="h-ac" data-i="h_ac"></h1>
        <p data-i="lead_ac"></p>
      </div>
      <div class="hgh-card hgh-form">
        <p class="hgv-chosen" id="chosen"></p>
        <label class="hgh-label" for="firstName" data-i="firstName"></label>
        <input id="firstName" autocomplete="given-name" maxlength="60" required>
        <label class="hgh-label" for="email" data-i="email"></label>
        <input id="email" type="email" autocomplete="email" maxlength="254" placeholder="nom@exemple.com" dir="ltr" required>
        <label class="hgh-label" for="country" data-i="country"></label>
        <input id="country" autocomplete="country-name" maxlength="60" required>
        <label class="hgh-label" for="city" data-i="city"></label>
        <input id="city" autocomplete="address-level2" maxlength="80" required>
        <div class="hgh-hp" aria-hidden="true"><label>Ne pas remplir<input type="text" id="hp" tabindex="-1" autocomplete="off"></label></div>
        <div class="hgh-checks consent">
          <label><input type="checkbox" id="terms"><span><span data-i="termsPre"></span> <a href="./conditions.html" target="_blank" rel="noopener" data-i="termsLink"></a> <span data-i="termsMid"></span> <a href="./confidentialite.html" target="_blank" rel="noopener" data-i="privLink"></a>.</span></label>
        </div>
        <p class="hgh-note" data-i="noAccount"></p>
        <p class="hgh-note" data-i="oneRole"></p>
      </div>
      <div class="hgh-actions">
        <button class="hgh-btn ghost" type="button" data-go="prev" data-i="back"></button>
        <button class="hgh-btn" id="finish" type="button" data-i="send"></button>
      </div>
      <p class="hgh-err" id="error2" role="alert"></p>
    </section>

    <section class="hgh-step hgh-done" id="done" hidden aria-live="polite" tabindex="-1">
      <h1 data-i="doneH"></h1>
      <p id="doneMsg"></p>
      <p class="hgh-err" id="roleNotice" role="status"></p>
      <div class="hgh-card">
        <h2 data-i="dashH"></h2>
        <p class="hgh-note" data-i="dashLead"></p>
        <div class="hgv-bar" role="img" id="dash-bar"><span></span></div>
        <ol class="hgv-steps" id="dash"></ol>
      </div>
      <a class="hgh-btn" href="./hostgo.html" data-i="backHome"></a>
    </section>
  </div>
  <footer class="hgh-foot"><a href="./?accueil=1">CheckMyVisa</a> · <span>Host &amp; Go</span> · <a href="./confidentialite.html" data-i="fPriv"></a> · <a href="./conditions.html" data-i="fTerms"></a></footer>
</main>
<script src="./hostgo-voyageur.js"></script>
</body>
</html>
