<link rel="stylesheet" href="vc.css">

<body class="pb-24 md:pb-10">
<div id="vc-header"></div>

<main class="mx-auto max-w-6xl px-4 py-5 md:py-8">
  <div class="mb-5">
    <span class="vc-badge vc-badge-info" data-i18n="assistant">Assistant 2</span>
    <h1 class="mt-2 text-2xl font-extrabold tracking-tight md:text-3xl" data-i18n="h1">Recours &amp; Gestion des Refus</h1>
    <p class="vc-mute mt-1 max-w-2xl text-sm md:text-base" data-i18n="lead"></p>
  </div>

  <!-- Étapes -->
  <ol class="mb-4 flex gap-2 text-xs font-bold" aria-label="Étapes" id="steps">
    <li class="vc-badge vc-badge-info" data-step="1">1 · <span data-i18n="s1">Analyser</span></li>
    <li class="vc-badge vc-badge-muted" data-step="2">2 · <span data-i18n="s2">Rédiger</span></li>
  </ol>

  <div class="grid gap-4 lg:grid-cols-2">
    <!-- ANALYSE DE LA LETTRE -->
    <section class="space-y-4" aria-labelledby="an-h">
      <div class="vc-card">
        <h2 id="an-h" class="vc-card-h" data-i18n="an_h">Lettre de refus</h2>

        <div class="grid gap-3 sm:grid-cols-2">
          <div>
            <label class="vc-label" for="r-dest" data-i18n="dest">Pays de destination</label>
            <select id="r-dest" class="vc-input">
              <option value="France">France</option><option value="España">España</option><option value="Italia">Italia</option>
              <option value="other" data-i18n="other_c">Autre pays</option>
            </select>
          </div>
          <div>
            <label class="vc-label" for="r-date" data-i18n="r_date">Date de la décision</label>
            <input id="r-date" type="date" class="vc-input">
          </div>
          <div class="sm:col-span-2">
            <label class="vc-label" for="r-days" data-i18n="r_days">Délai de recours indiqué sur la lettre (jours)</label>
            <input id="r-days" type="number" min="1" max="365" inputmode="numeric" class="vc-input" value="30">
          </div>
        </div>

        <label class="vc-label mt-3" for="r-text" data-i18n="paste">Collez le texte de la lettre (ou cochez les motifs ci-dessous)</label>
        <textarea id="r-text" class="vc-input" rows="5" data-i18n-ph="paste_ph"></textarea>

        <div class="mt-2 flex flex-wrap gap-2">
          <button type="button" id="r-detect" class="vc-btn vc-btn-primary vc-btn-sm" data-i18n="detect">Détecter les motifs</button>
          <button type="button" id="r-clear" class="vc-btn vc-btn-sm" data-i18n="clear">Effacer</button>
        </div>

        <fieldset class="mt-4">
          <legend class="vc-label" data-i18n="motifs_h">Motifs de refus invoqués</legend>
          <div id="motifs" class="space-y-2"></div>
        </fieldset>
        <p class="vc-mute mt-3 text-xs" data-i18n="privacy"></p>
      </div>

      <div class="vc-card" id="analysis-card">
        <div class="flex items-center justify-between gap-2">
          <h2 class="vc-card-h !mb-0" data-i18n="diag_h">Diagnostic</h2>
          <span id="deadline-badge" class="vc-badge vc-badge-muted" data-i18n="no_date">Date manquante</span>
        </div>
        <div id="diag" class="mt-3 space-y-3"></div>
      </div>
    </section>

    <!-- GÉNÉRATEUR -->
    <section class="space-y-4" aria-labelledby="gen-h">
      <div class="vc-card">
        <h2 id="gen-h" class="vc-card-h" data-i18n="gen_h">Générateur de recours</h2>
        <div class="grid gap-3 sm:grid-cols-2">
          <div class="sm:col-span-2">
            <label class="vc-label" for="g-name" data-i18n="g_name">Nom et prénom (comme sur le passeport)</label>
            <input id="g-name" class="vc-input" autocomplete="name">
          </div>
          <div>
            <label class="vc-label" for="g-ref" data-i18n="g_ref">N° de dossier / référence</label>
            <input id="g-ref" class="vc-input" autocomplete="off">
          </div>
          <div>
            <label class="vc-label" for="g-post" data-i18n="g_post">Consulat / centre destinataire</label>
            <input id="g-post" class="vc-input" autocomplete="off">
          </div>
          <div>
            <label class="vc-label" for="g-city" data-i18n="g_city">Ville</label>
            <input id="g-city" class="vc-input" autocomplete="address-level2">
          </div>
          <div>
            <label class="vc-label" for="g-lang" data-i18n="g_lang">Langue de la lettre</label>
            <select id="g-lang" class="vc-input"><option value="fr">Français</option><option value="en">English</option></select>
          </div>
          <div class="sm:col-span-2">
            <label class="vc-label" for="g-facts" data-i18n="g_facts">Vos éléments concrets (dates, montants, employeur…)</label>
            <textarea id="g-facts" class="vc-input" rows="3" data-i18n-ph="g_facts_ph"></textarea>
          </div>
        </div>

        <div class="mt-4 flex flex-wrap gap-2">
          <button type="button" id="g-make" class="vc-btn vc-btn-primary grow" data-i18n="g_make">Générer la lettre</button>
        </div>
      </div>

      <div class="vc-card" id="out-card">
        <div class="flex items-center justify-between gap-2">
          <h2 class="vc-card-h !mb-0" data-i18n="out_h">Votre lettre</h2>
          <span id="out-badge" class="vc-badge vc-badge-muted" data-i18n="out_draft">Brouillon</span>
        </div>
        <textarea id="out" class="vc-input mt-3" rows="14" style="font-family:Georgia,'Times New Roman',serif" aria-label="Lettre"></textarea>
        <div id="todo" class="mt-3"></div>
        <div class="mt-3 flex flex-wrap gap-2">
          <button type="button" id="o-copy" class="vc-btn vc-btn-sm" data-i18n="copy">Copier</button>
          <button type="button" id="o-txt" class="vc-btn vc-btn-sm" data-i18n="dl">Télécharger .txt</button>
          <button type="button" id="o-print" class="vc-btn vc-btn-sm" data-i18n="print">Imprimer / PDF</button>
        </div>
      </div>
      <p class="vc-mute text-xs" data-i18n="disclaimer"></p>
    </section>
  </div>
</main>

  function renderMotifs() {
    var box = $('motifs'); box.textContent = '';
    ORDER.forEach(function (k) {
      var lab = VC.el('label', 'vc-row cursor-pointer items-start !flex-nowrap');
      var cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = !!checked[k]; cb.className = 'mt-1 h-5 w-5 shrink-0';
      cb.addEventListener('change', function () { checked[k] = cb.checked; renderDiag(); });
      lab.appendChild(cb);
      lab.appendChild(VC.el('span', 'text-sm', VC.t('m_' + k)));
      box.appendChild(lab);
    });
  }

  function detect() {
    var txt = $('r-text').value.toLowerCase(), n = 0;
    ORDER.forEach(function (k) {

    });
    renderMotifs(); renderDiag();
    VC.toast(n ? VC.t('detected', { n: n }) : VC.t('none_detected'));
  }

  /* ---------- Diagnostic + délai ---------- */
  function renderDiag() {
    var d = $('diag'); d.textContent = '';
    var keys = ORDER.filter(function (k) { return checked[k]; });

    var badge = $('deadline-badge'), v = $('r-date').value, days = parseInt($('r-days').value, 10);
    if (v && days > 0) {
      var end = new Date(v); end.setDate(end.getDate() + days);
      var today = new Date(); today.setHours(0, 0, 0, 0);
      var diff = Math.round((end - today) / 86400000);
      var kind = diff < 0 ? 'err' : diff <= 7 ? 'warn' : 'ok';
      badge.className = 'vc-badge vc-badge-' + kind;
      badge.textContent = diff < 0 ? VC.t('dl_over', { n: -diff }) : diff === 0 ? VC.t('dl_today') : VC.t('dl_left', { n: diff });
      lastDeadline = end.toLocaleDateString(VC.lang === 'ar' ? 'ar-TN' : VC.lang === 'en' ? 'en-GB' : 'fr-FR');
      d.appendChild(VC.el('p', 'vc-mute text-xs', VC.t('dl_note', { d: lastDeadline })));
    } else {
      badge.className = 'vc-badge vc-badge-muted'; badge.textContent = VC.t('no_date'); lastDeadline = null;
    }

    if (!keys.length) { d.appendChild(VC.el('p', 'vc-mute text-sm', VC.t('pick_one'))); return; }
    d.appendChild(VC.el('h3', 'text-sm font-bold', VC.t('fix_h')));
    keys.forEach(function (k) {
      var row = VC.el('div', 'vc-row !flex-nowrap items-start');
      row.appendChild(VC.badge('warn', VC.t('st_warn')));
      var col = VC.el('div', 'text-sm');
      col.appendChild(VC.el('div', 'font-semibold', VC.t('m_' + k)));
      col.appendChild(VC.el('div', 'vc-mute', VC.t(MOTIFS[k].docs[0])));
      row.appendChild(col); d.appendChild(row);
    });
  }

  /* ---------- Génération de la lettre ---------- */
  function generate() {
    var keys = ORDER.filter(function (k) { return checked[k]; });
    if (!keys.length) { VC.toast(VC.t('need_motif')); return; }
    var L = T[$('g-lang').value] || T.fr, td = L.todo;
    var name = $('g-name').value.trim() || td, ref = $('g-ref').value.trim() || td;
    var post = $('g-post').value.trim() || td, city = $('g-city').value.trim() || td;
    var dv = $('r-date').value, date = dv ? new Date(dv).toLocaleDateString($('g-lang').value === 'en' ? 'en-GB' : 'fr-FR') : td;
    var facts = $('g-facts').value.trim();
    var now = new Date().toLocaleDateString($('g-lang').value === 'en' ? 'en-GB' : 'fr-FR');
    var pj = keys.map(function (k) { return DICT[$('g-lang').value][MOTIFS[k].docs[0]] || DICT.fr[MOTIFS[k].docs[0]]; }).join(' ; ');

    var parts = [
      name, '',
      post, '',
      city + ', ' + now, '',
      L.subj.replace('{ref}', ref), '',
      L.hello, '',
      L.intro.replace('{date}', date).replace('{ref}', ref), ''
    ];
    if (facts) { parts.push(L.facts.replace('{facts}', facts), ''); }
    parts.push(L.motifHead);
    keys.forEach(function (k, i) { parts.push((i + 1) + '. ' + L.m[k]); });
    parts.push('', L.close, '', L.pj.replace('{pj}', pj), '', name);

    $('out').value = parts.join('\n');
    var b = $('out-badge'); b.className = 'vc-badge vc-badge-info'; b.textContent = VC.t('out_ready');
    checkTodo(); setStep(2);
    $('out-card').scrollIntoView({ behavior: 'smooth', block: 'start' });

    if (!$('r-text').value.trim()) {
      VC.toast('Ajoutez le texte de la notification de refus pour générer une lettre personnalisée.');
      return;
    }
    if (!window.confirm('Les informations saisies et les motifs du refus seront transmis au service IA CheckMyVisa pour rédiger un projet de lettre. Continuer ?')) return;
    VC.api.withBusy($('g-make'), function () {
      return VC.api.generateAppeal({
        authority: $('r-dest').value || $('g-post').value,
        refusalDate: $('r-date').value,
        reference: $('g-ref').value,
        refusalText: $('r-text').value,
        facts: $('g-facts').value,
        identity: [$('g-name').value, $('g-post').value, $('g-city').value].join(' — '),
        language: $('g-lang').value
      });
    }).then(function (data) {
      $('out').value = data.reply || '';
      $('out-badge').className = 'vc-badge vc-badge-info';
      $('out-badge').textContent = VC.t('out_ready');
      checkTodo();
    }).catch(function (e) {
      VC.toast(VC.api.errorMessage(e));
    });
  }

  function checkTodo() {
    var t = $('out').value, n = (t.match(/\[(à compléter|to complete)[^\]]*\]/g) || []).length, box = $('todo');
    box.textContent = '';
    if (!t) return;
    var row = VC.el('div', 'vc-row');
    row.appendChild(VC.badge(n ? 'warn' : 'ok', n ? String(n) : '✓'));
    row.appendChild(VC.el('span', 'text-sm', n ? VC.t('todo_h') + ' ' + n : VC.t('todo_none')));
    box.appendChild(row);
  }

  function setStep(n) {
    Array.prototype.forEach.call(document.querySelectorAll('#steps li'), function (li) {
      li.className = 'vc-badge ' + (parseInt(li.dataset.step, 10) <= n ? 'vc-badge-info' : 'vc-badge-muted');
    });
  }

  /* ---------- Sorties ---------- */
  function download(text) {
    var blob = new Blob([text], { type: 'text/plain;charset=utf-8' }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'recours-visa.txt';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  /* ---------- Événements ---------- */
  $('r-detect').addEventListener('click', detect);
  $('r-clear').addEventListener('click', function () { $('r-text').value = ''; checked = {}; renderMotifs(); renderDiag(); });
  ['r-date', 'r-days'].forEach(function (id) { $(id).addEventListener('input', renderDiag); });
  $('g-make').addEventListener('click', generate);
  $('out').addEventListener('input', checkTodo);
  $('o-copy').addEventListener('click', function () {
    if (!$('out').value) { VC.toast(VC.t('need_motif')); return; }
    VC.copy($('out').value).then(function () { VC.toast(VC.t('copied')); }, function () { VC.toast(VC.t('copy_fail')); });
  });
  $('o-txt').addEventListener('click', function () { if ($('out').value) download($('out').value); else VC.toast(VC.t('need_motif')); });
  $('o-print').addEventListener('click', function () {
    if (!$('out').value) { VC.toast(VC.t('need_motif')); return; }
    $('print-area').textContent = $('out').value; window.print();
  });
  document.addEventListener('vc:lang', function () { renderMotifs(); renderDiag(); checkTodo(); });

  /* ---------- Démarrage ---------- */
  VC.init(DICT, 'recours');
  renderMotifs(); renderDiag();
})();
</script>
</body>
</html>
