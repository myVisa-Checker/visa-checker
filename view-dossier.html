<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f7fc">
<title>Préparation &amp; Analyse de Dossier – Visa Checker</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<link rel="stylesheet" href="vc.css">
<script src="vc-shared.js"></script>
</head>
<body class="pb-24 md:pb-10">
<div id="vc-header"></div>

<main class="mx-auto max-w-6xl px-4 py-5 md:py-8">
  <!-- Titre -->
  <div class="mb-5">
    <span class="vc-badge vc-badge-info" data-i18n="assistant">Assistant 1</span>
    <h1 class="mt-2 text-2xl font-extrabold tracking-tight md:text-3xl" data-i18n="h1">Préparation &amp; Analyse de Dossier</h1>
    <p class="vc-mute mt-1 max-w-2xl text-sm md:text-base" data-i18n="lead"></p>
  </div>

  <div class="grid gap-4 lg:grid-cols-5">
    <!-- COLONNE GAUCHE : contexte + dépôt -->
    <section class="space-y-4 lg:col-span-3" aria-labelledby="ctx-h">
      <div class="vc-card">
        <h2 id="ctx-h" class="vc-card-h" data-i18n="ctx">Votre demande</h2>
        <div class="grid gap-3 sm:grid-cols-2">
          <div>
            <label class="vc-label" for="f-passport" data-i18n="passport">Passeport</label>
            <select id="f-passport" class="vc-input">
              <option value="tn">Tunisie</option><option value="ma">Maroc</option><option value="dz">Algérie</option>
            </select>
          </div>
          <div>
            <label class="vc-label" for="f-dest" data-i18n="dest">Destination</label>
            <select id="f-dest" class="vc-input">
              <option value="fr">France</option><option value="es">España</option><option value="it">Italia</option>
            </select>
          </div>
          <div>
            <label class="vc-label" for="f-purpose" data-i18n="purpose">Motif du voyage</label>
            <select id="f-purpose" class="vc-input">
              <option value="tourism" data-i18n="p_tourism">Tourisme</option>
              <option value="visit" data-i18n="p_visit">Visite familiale / privée</option>
              <option value="business" data-i18n="p_business">Affaires</option>
              <option value="study" data-i18n="p_study">Études</option>
            </select>
          </div>
          <div>
            <label class="vc-label" for="f-status" data-i18n="status">Situation professionnelle</label>
            <select id="f-status" class="vc-input">
              <option value="employee" data-i18n="s_employee">Salarié(e)</option>
              <option value="self" data-i18n="s_self">Indépendant / commerçant</option>
              <option value="student" data-i18n="s_student">Étudiant(e)</option>
              <option value="retired" data-i18n="s_retired">Retraité(e)</option>
              <option value="none" data-i18n="s_none">Sans emploi</option>
            </select>
          </div>
          <div>
            <label class="vc-label" for="f-dep" data-i18n="dep">Départ</label>
            <input id="f-dep" type="date" class="vc-input">
          </div>
          <div>
            <label class="vc-label" for="f-ret" data-i18n="ret">Retour</label>
            <input id="f-ret" type="date" class="vc-input">
          </div>
          <div class="sm:col-span-2">
            <label class="vc-label" for="f-exp" data-i18n="exp">Fin de validité du passeport</label>
            <input id="f-exp" type="date" class="vc-input">
          </div>
        </div>
      </div>

      <div class="vc-card">
        <h2 class="vc-card-h" data-i18n="drop_h">Vos justificatifs</h2>
        <label id="drop" class="vc-drop cursor-pointer" tabindex="0" for="f-files">
          <span class="vc-accent" aria-hidden="true" id="drop-ico"></span>
          <strong data-i18n="drop_t">Déposez vos documents ici</strong>
          <span class="vc-mute text-sm" data-i18n="drop_s">ou touchez pour choisir · PDF, JPG, PNG · 8 Mo max par fichier</span>
          <input id="f-files" type="file" class="sr-only-vc" multiple accept="application/pdf,image/jpeg,image/png,image/webp">
        </label>
        <div class="mt-2 flex flex-wrap gap-2">
          <label class="vc-btn vc-btn-sm cursor-pointer" for="f-cam">
            <span id="cam-ico" aria-hidden="true"></span><span data-i18n="scan">Scanner avec la caméra</span>
          </label>
          <input id="f-cam" type="file" class="sr-only-vc" accept="image/*" capture="environment">
        </div>
        <p class="vc-mute mt-3 text-xs" data-i18n="privacy"></p>

        <ul id="files" class="mt-4 space-y-2" aria-live="polite"></ul>
      </div>
    </section>

    <!-- COLONNE DROITE : rapport -->
    <aside class="space-y-4 lg:col-span-2 lg:sticky lg:top-20 lg:self-start" aria-labelledby="rep-h">
      <div class="vc-card">
        <div class="flex items-center justify-between gap-2">
          <h2 id="rep-h" class="vc-card-h !mb-0" data-i18n="rep_h">Rapport d’anomalies</h2>
          <span id="score-badge" class="vc-badge vc-badge-muted" data-i18n="rep_wait">En attente</span>
        </div>

        <div class="mt-3">
          <div class="mb-1 flex justify-between text-xs font-semibold">
            <span class="vc-mute" data-i18n="readiness">Dossier prêt à</span>
            <span id="score-txt">0 %</span>
          </div>
          <div class="vc-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="score-bar"><i></i></div>
        </div>

        <div id="counts" class="mt-4 grid grid-cols-3 gap-2 text-center"></div>

        <h3 class="mt-5 mb-2 text-sm font-bold" data-i18n="issues">Points à corriger</h3>
        <ul id="issues" class="space-y-2"></ul>

        <h3 class="mt-5 mb-2 text-sm font-bold" data-i18n="checklist">Pièces attendues</h3>
        <ul id="checklist" class="space-y-1.5"></ul>

        <div class="mt-5 flex flex-wrap gap-2">
          <button type="button" id="btn-analyze" class="vc-btn vc-btn-primary grow" data-i18n="analyze">Analyser mon dossier</button>
          <button type="button" id="btn-copy" class="vc-btn" data-i18n="copy">Copier le rapport</button>
        </div>
        <a href="view-recours.html" id="to-appeal" class="vc-accent mt-3 hidden text-sm font-semibold" data-i18n="to_appeal">Dossier déjà refusé ? Préparer un recours →</a>
      </div>
      <p class="vc-mute text-xs" data-i18n="disclaimer"></p>
    </aside>
  </div>
</main>

<div id="vc-bottomnav"></div>

  /* ---------- Règles : pièces attendues selon le profil (indicatif) ---------- */
  var BASE_DOCS = ['form', 'passport', 'photo', 'insurance', 'flight', 'lodging', 'bank', 'civil'];
  function expectedDocs() {
    var docs = BASE_DOCS.slice(), s = $('f-status').value, p = $('f-purpose').value;
    if (s === 'employee') docs.push('work');
    if (s === 'self') docs.push('reg');
    if (s === 'student') docs.push('enrol');
    if (s === 'retired') docs.push('pension');
    if (p === 'visit') docs.push('invite');
    if (p === 'business') docs.push('mission');
    return docs;
  }

  var files = [];   // {id, file, type, w, h, lowres}
  var analyzed = false;
  var nextId = 1;

  /* ---------- Gestion des fichiers ---------- */
  var OK_TYPES = /^(application\/pdf|image\/(jpeg|png|webp))$/;
  function addFiles(list) {
    Array.prototype.forEach.call(list, function (f) {
      var rec = { id: nextId++, file: f, type: '', w: 0, h: 0 };
      files.push(rec);
      if (/^image\//.test(f.type) && OK_TYPES.test(f.type)) {
        var url = URL.createObjectURL(f), img = new Image();
        img.onload = function () { rec.w = img.naturalWidth; rec.h = img.naturalHeight; URL.revokeObjectURL(url); renderFiles(); if (analyzed) analyze(); };
        img.onerror = function () { URL.revokeObjectURL(url); };
        img.src = url;
      }
    });
    renderFiles();
    if (analyzed) analyze();
  }

  function fileIssues(r) {
    var out = [], f = r.file;
    if (!OK_TYPES.test(f.type)) out.push({ lvl: 'err', msg: VC.t('i_format', { name: f.name }) });
    if (f.size > 8 * 1048576) out.push({ lvl: 'err', msg: VC.t('i_big', { name: f.name }) });
    if (r.w && Math.max(r.w, r.h) < 1000) out.push({ lvl: 'warn', msg: VC.t('i_lowres', { name: f.name, w: r.w, h: r.h }) });
    if (!r.type) out.push({ lvl: 'warn', msg: VC.t('i_unclassified', { name: f.name }) });
    var dup = files.some(function (o) { return o.id < r.id && o.file.size === f.size; });
    if (dup) out.push({ lvl: 'warn', msg: VC.t('i_dup', { name: f.name }) });
    return out;
  }

  function renderFiles() {
    var ul = $('files'); ul.textContent = '';
    if (!files.length) { ul.appendChild(VC.el('li', 'vc-mute text-sm', VC.t('no_files'))); return; }
    var allDocs = Object.keys(DICT.fr).filter(function (k) { return k.indexOf('d_') === 0; });
    files.forEach(function (r) {
      var li = VC.el('li', 'vc-row');
      var name = VC.el('div', 'min-w-0 grow');
      name.appendChild(VC.el('div', 'truncate text-sm font-semibold', r.file.name));
      name.appendChild(VC.el('div', 'vc-mute text-xs', VC.fmtSize(r.file.size) + (r.w ? ' · ' + r.w + '×' + r.h : '')));
      li.appendChild(name);

      var iss = fileIssues(r), lvl = iss.some(function (x) { return x.lvl === 'err'; }) ? 'err' : (iss.length ? 'warn' : 'ok');
      li.appendChild(VC.badge(lvl, VC.t('st_' + lvl)));

      var sel = VC.el('select', 'vc-input');
      sel.style.cssText = 'width:auto;min-height:2.25rem;padding:.2rem .5rem;font-size:14px;max-width:100%';
      sel.setAttribute('aria-label', VC.t('type_lbl'));
      var o0 = VC.el('option', null, VC.t('t_unknown')); o0.value = ''; sel.appendChild(o0);
      allDocs.forEach(function (k) {
        var o = VC.el('option', null, VC.t(k)); o.value = k.slice(2); if (r.type === o.value) o.selected = true; sel.appendChild(o);
      });
      sel.addEventListener('change', function () { r.type = sel.value; renderFiles(); if (analyzed) analyze(); });
      li.appendChild(sel);

      var rm = VC.el('button', 'vc-btn vc-btn-sm vc-btn-icon', '✕');
      rm.type = 'button'; rm.setAttribute('aria-label', VC.t('remove')); rm.title = VC.t('remove');
      rm.addEventListener('click', function () { files = files.filter(function (x) { return x.id !== r.id; }); renderFiles(); if (analyzed) analyze(); });
      li.appendChild(rm);
      ul.appendChild(li);
    });
  }

  /* ---------- Analyse locale ---------- */
  var lastReport = '';
  function analyze() {
    analyzed = true;
    var issues = [], today = new Date(); today.setHours(0, 0, 0, 0);
    var dep = $('f-dep').value ? new Date($('f-dep').value) : null;
    var ret = $('f-ret').value ? new Date($('f-ret').value) : null;
    var exp = $('f-exp').value ? new Date($('f-exp').value) : null;

    if (!dep || !ret) issues.push({ lvl: 'warn', msg: VC.t('i_dates_miss') });
    else if (ret < dep) issues.push({ lvl: 'err', msg: VC.t('i_dates') });
    if (dep && dep < today) issues.push({ lvl: 'warn', msg: VC.t('i_past') });
    if (exp) {
      var limit = new Date(ret || dep || today); limit.setMonth(limit.getMonth() + 3);
      if (exp < limit) issues.push({ lvl: 'err', msg: VC.t('i_passport_exp') });
    }

    var have = {}; files.forEach(function (r) { if (r.type) have[r.type] = true; });
    var exps = expectedDocs(), done = 0;
    var cl = $('checklist'); cl.textContent = '';
    exps.forEach(function (k) {
      var ok = !!have[k]; if (ok) done++; else issues.push({ lvl: 'err', msg: VC.t('i_missing', { doc: VC.t('d_' + k) }), missing: true });
      var li = VC.el('li', 'flex items-center gap-2 text-sm');
      li.appendChild(VC.badge(ok ? 'ok' : 'muted', ok ? '✓' : '·'));
      li.appendChild(VC.el('span', ok ? '' : 'vc-mute', VC.t('d_' + k)));
      cl.appendChild(li);
    });

    files.forEach(function (r) { fileIssues(r).forEach(function (x) { issues.push(x); }); });

    /* Score : pièces (70 %) puis pénalités qualité/dates */
    var score = Math.round((done / exps.length) * 70);
    var errs = issues.filter(function (x) { return x.lvl === 'err' && !x.missing; }).length;
    var warns = issues.filter(function (x) { return x.lvl === 'warn'; }).length;
    score = Math.max(0, Math.min(100, score + 30 - errs * 12 - warns * 5));
    if (!files.length) score = 0;

    $('score-txt').textContent = score + ' %';
    var bar = $('score-bar'); bar.setAttribute('aria-valuenow', score); bar.firstElementChild.style.width = score + '%';
    var anyErr = issues.some(function (x) { return x.lvl === 'err'; });
    var sb = $('score-badge');
    var k = anyErr ? 'err' : (issues.length ? 'warn' : 'ok');
    sb.className = 'vc-badge vc-badge-' + k;
    sb.textContent = VC.t(k === 'err' ? 'st_blocked' : k === 'warn' ? 'st_todo' : 'st_ready');

    var nOk = done, nWarn = warns, nErr = issues.filter(function (x) { return x.lvl === 'err'; }).length;
    var cEl = $('counts'); cEl.textContent = '';
    [['ok', nOk, 'c_ok'], ['warn', nWarn, 'c_warn'], ['err', nErr, 'c_err']].forEach(function (c) {
      var box = VC.el('div', 'vc-soft p-2');
      box.appendChild(VC.el('div', 'text-xl font-extrabold', String(c[1])));
      box.appendChild(VC.badge(c[0], VC.t(c[2])));
      cEl.appendChild(box);
    });

    var ul = $('issues'); ul.textContent = '';
    issues.sort(function (a, b) { return (a.lvl === 'err' ? 0 : 1) - (b.lvl === 'err' ? 0 : 1); });
    if (!issues.length) ul.appendChild(VC.el('li', 'vc-mute text-sm', VC.t('no_issues')));
    issues.forEach(function (x) {
      var li = VC.el('li', 'vc-row !flex-nowrap items-start');
      li.appendChild(VC.badge(x.lvl, VC.t('st_' + x.lvl)));
      li.appendChild(VC.el('span', 'text-sm', x.msg));
      ul.appendChild(li);
    });
    ul.appendChild(VC.el('li', 'vc-mute text-xs', VC.t('i_dest_check')));

    $('to-appeal').classList.remove('hidden');
    lastReport = VC.t('r_title') + ' — ' + VC.t('r_ready') + ' ' + score + ' %\n' +
      issues.map(function (x) { return '• ' + x.msg; }).join('\n');
  }

  function idleReport() {
    $('checklist').textContent = '';
    expectedDocs().forEach(function (k) {
      var li = VC.el('li', 'flex items-center gap-2 text-sm');
      li.appendChild(VC.badge('muted', '·')); li.appendChild(VC.el('span', 'vc-mute', VC.t('d_' + k)));
      $('checklist').appendChild(li);
    });
    $('issues').textContent = '';
    $('issues').appendChild(VC.el('li', 'vc-mute text-sm', VC.t('run_first')));
  }

  /* ---------- Événements ---------- */
  var drop = $('drop');
  ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('is-over'); }); });
  ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('is-over'); }); });
  drop.addEventListener('drop', function (e) { if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files); });
  drop.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('f-files').click(); } });
  $('f-files').addEventListener('change', function (e) { addFiles(e.target.files); e.target.value = ''; });
  $('f-cam').addEventListener('change', function (e) { addFiles(e.target.files); e.target.value = ''; });
  $('btn-analyze').addEventListener('click', analyze);
  $('btn-copy').addEventListener('click', function () {
    if (!lastReport) analyze();
    VC.copy(lastReport).then(function () { VC.toast(VC.t('copied')); }, function () { VC.toast(VC.t('copy_fail')); });
  });
  ['f-status', 'f-purpose'].forEach(function (id) { $(id).addEventListener('change', function () { analyzed ? analyze() : idleReport(); }); });
  ['f-dep', 'f-ret', 'f-exp', 'f-passport', 'f-dest'].forEach(function (id) { $(id).addEventListener('change', function () { if (analyzed) analyze(); }); });
  document.addEventListener('vc:lang', function () { renderFiles(); analyzed ? analyze() : idleReport(); });

  /* ---------- Démarrage ---------- */
  VC.init(DICT, 'dossier');
  $('drop-ico').innerHTML = VC.icon('M12 16V4m0 0l-4 4m4-4l4 4M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3', 36);
  $('cam-ico').innerHTML = VC.icon('M4 8h3l2-3h6l2 3h3v11H4zM12 17a3.5 3.5 0 100-7 3.5 3.5 0 000 7z', 18);
  renderFiles(); idleReport();
})();
</script>
</body>
</html>
