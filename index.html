<title>Visa Checker</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one narrow column, phone first. Situation chips on top, sticky progress strip, checklist grouped by purpose. FR / EN / AR (RTL). */
:root{
  --bg:#eef1f3; --surface:#ffffff; --ink:#14212b; --muted:#566772; --line:#d3dbe0;
  --accent:#c8372d; --accent-soft:#f8e4e1; --ok:#1f7a4d; --ok-soft:#dff1e7; --on-accent:#ffffff;
  --f-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-ar:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e161c; --surface:#16222a; --ink:#e8eef2; --muted:#93a4af; --line:#2a3a44;
  --accent:#ef6a5e; --accent-soft:#3a2120; --ok:#4fc08a; --ok-soft:#173326; --on-accent:#1a0f0e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e161c; --surface:#16222a; --ink:#e8eef2; --muted:#93a4af; --line:#2a3a44;
  --accent:#ef6a5e; --accent-soft:#3a2120; --ok:#4fc08a; --ok-soft:#173326; --on-accent:#1a0f0e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-inline:16px;padding-block:0 48px}
.wrap{max-width:680px;margin-inline:auto}
header{padding-block:24px 8px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.stamp{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);
  border:2px double var(--accent);padding:4px 8px;border-radius:4px;transform:rotate(-3deg);white-space:nowrap}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:transparent;color:var(--muted);font:500 13px var(--f-mono);padding:6px 12px;cursor:pointer;min-width:44px;min-height:32px}
.lang button#l-ar{font-family:var(--f-ar);font-size:14px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,8vw,2.9rem);line-height:1.05;margin:0;letter-spacing:-.02em;text-wrap:balance}
.sub{margin:0;color:var(--muted);max-width:56ch}
h2{font-family:var(--f-display);font-weight:600;font-size:1.15rem;margin:0;text-wrap:balance}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:16px;margin-top:16px}
.q{display:flex;flex-direction:column;gap:8px;min-width:0}
.q-label{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 14px var(--f-body);padding:8px 14px;border-radius:999px;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.progress{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;margin-top:8px;border-bottom:1px solid var(--line)}
.p-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.p-num{font-family:var(--f-display);font-weight:800;font-size:1.6rem;font-variant-numeric:tabular-nums}
.p-msg{font-size:14px;color:var(--muted);min-width:0}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.bar.done i{background:var(--ok)}
section.group{margin-top:24px;display:flex;flex-direction:column;gap:10px}
.g-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.g-count{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.item{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.item input{width:22px;height:22px;margin:2px 0 0;flex:none;accent-color:var(--ok);cursor:pointer}
.item.on{background:var(--ok-soft);border-color:var(--ok)}
.i-body{display:flex;flex-direction:column;gap:2px;min-width:0}
.i-title{font-weight:600;overflow-wrap:anywhere}
.i-note{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.tag{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px;align-self:flex-start;margin-bottom:2px}
.book{border:2px dashed var(--accent);background:var(--accent-soft);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.book b{font-family:var(--f-display);font-size:1.05rem}
.book p{margin:0;font-size:14px}
.book .slot{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
footer{margin-top:32px;display:flex;flex-direction:column;gap:12px;font-size:13px;color:var(--muted)}
footer p{margin:0}
.links{display:flex;flex-wrap:wrap;gap:8px 16px}
.links a{color:var(--ink);font-weight:600}
.reset{align-self:flex-start;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 13px var(--f-body);padding:8px 14px;border-radius:8px;cursor:pointer;min-height:40px}
.sel{width:100%;min-height:44px;font:500 15px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.agency{margin-top:32px;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.ag-sub,.ag-note,.ag-none{margin:0;font-size:14px;color:var(--muted)}
.partner{display:flex;flex-direction:column;gap:4px;border:1px solid var(--ok);background:var(--ok-soft);border-radius:10px;padding:12px 14px}
.partner b{font-family:var(--f-display);font-size:1.05rem}
.locked{display:flex;flex-direction:column;gap:8px;border:1px dashed var(--line);border-radius:10px;padding:12px 14px}
.locked i{display:block;height:12px;border-radius:99px;background:var(--line)}
.locked i:last-child{width:60%}
.pay{align-self:flex-start;display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 20px;border-radius:10px;background:var(--accent);color:var(--on-accent);font:600 16px var(--f-body);text-decoration:none;border:0;cursor:pointer}
.pay.off{background:var(--line);color:var(--muted);cursor:not-allowed}
.code-row{display:flex;gap:8px;flex-wrap:wrap}
.code-row .sel{flex:1 1 140px;width:auto}
.ag-err{font-size:13px;color:var(--accent);min-height:1em}
.refus{margin-top:24px;display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.refus p{margin:0}
.inc,.adv{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px}
.price{font-family:var(--f-display);font-weight:800;font-size:1.25rem}
.rf-sub{font-size:14px;color:var(--muted)}
.lt{border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.lt summary{padding:12px 14px;font-weight:600;cursor:pointer;min-height:44px;display:flex;align-items:center}
.lt-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
pre.letter{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;direction:ltr;text-align:left;font:14px/1.55 var(--f-body);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;user-select:text}
.cp{align-self:flex-start;border:0;background:var(--ink);color:var(--bg);font:600 14px var(--f-body);padding:10px 16px;border-radius:8px;cursor:pointer;min-height:44px}
html[lang="ar"] .price,html[lang="ar"] .lt summary,html[lang="ar"] .cp,html[lang="ar"] .refus h2{font-family:var(--f-ar)}
html[lang="ar"] .sel,html[lang="ar"] .pay,html[lang="ar"] .partner b{font-family:var(--f-ar)}
/* Arabic: RTL, Arabic faces, no letter-spacing or uppercasing (both break letter joining) */
html[lang="ar"] body,html[lang="ar"] .chip,html[lang="ar"] .reset{font-family:var(--f-ar);line-height:1.65}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] .p-num,html[lang="ar"] .book b{font-family:var(--f-ar);font-weight:700;letter-spacing:0}
html[lang="ar"] h1{line-height:1.3}
html[lang="ar"] .stamp,html[lang="ar"] .q-label,html[lang="ar"] .tag,html[lang="ar"] .book .slot,html[lang="ar"] .g-count{font-family:var(--f-ar);letter-spacing:0;text-transform:none}
html[lang="ar"] .stamp{font-size:13px}
html[lang="ar"] .q-label,html[lang="ar"] .book .slot{font-size:13px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<div class="wrap">
  <header>
    <div class="top">
      <span class="stamp" id="stamp"></span>
      <div class="lang" role="group" aria-label="Langue / Language / اللغة">

  <div class="panel" id="panel"></div>

  <div class="progress" aria-live="polite">

    <div class="bar" id="bar"><i id="barfill"></i></div>
  </div>

  <div id="list"></div>

  <div class="agency" id="agency"></div>

  <div class="refus" id="refus"></div>

  <footer>
    <div class="links" id="links"></div>
    <p id="disc"></p>
    <button type="button" class="reset" id="reset"></button>
  </footer>
</div>

  ["fr","en","ar"].forEach(function(l){$("l-"+l).setAttribute("aria-pressed",S.lang===l)});
  $("panel").innerHTML=panelHtml(t);
  var vis=(S.purpose==="reunion"?RITEMS:ITEMS).filter(function(i){return i.w(S)});
  var req=vis.filter(function(i){return !i.opt}),doneReq=req.filter(function(i){return S.done[i.id]}).length;
  var pct=req.length?Math.round(doneReq/req.length*100):0,left=req.length-doneReq;
  $("pnum").textContent=doneReq+" "+t.of+" "+req.length+" "+t.ready;
  $("pmsg").textContent=left===0?t.msgDone:(doneReq===0?t.msg0:t.msgN(left));
  $("barfill").style.width=pct+"%";$("bar").className="bar"+(left===0?" done":"");
  var h="";
  ORDER.forEach(function(g){
    var gi=vis.filter(function(i){return i.g===g});if(!gi.length)return;
    var gd=gi.filter(function(i){return S.done[i.id]}).length;
    h+='<section class="group"><div class="g-head"><h2>'+t.groups[g]+'</h2><span class="g-count">'+gd+'/'+gi.length+'</span></div>';
    gi.forEach(function(i){
      var c=i[S.lang],on=!!S.done[i.id];
      h+='<label class="item'+(on?' on':'')+'"><input type="checkbox" data-id="'+i.id+'"'+(on?' checked':'')+'><span class="i-body">'+(i.opt?'<span class="tag">'+t.opt+'</span>':'')+'<span class="i-title">'+c[0]+'</span>'+(c[1]?'<span class="i-note">'+c[1]+'</span>':'')+'</span></label>';
    });
    if(g==="stay"){h+='<div class="book"><span class="slot">'+t.bookSlot+'</span><b>'+t.bookTitle+'</b><p>'+t.bookText+'</p></div>'}
    h+='</section>';
  });
  $("list").innerHTML=ready?h:"";
  document.querySelector(".progress").hidden=!ready;
  renderAgency(t);
  $("refus").hidden=!ready;
  if(ready)renderRefus(t);
}
document.addEventListener("click",function(e){
  if(e.target.id==="unlock"){
    var v=($("code").value||"").trim().toUpperCase();
    if(CODES.indexOf(v)>-1){S.paid=true;save();render()}else{$("err").textContent=UI[S.lang].badCode}
    return;
  }
  if(e.target.id==="unlock2"){
    var v2=($("code2").value||"").trim().toUpperCase();
    if(CODES2.indexOf(v2)>-1){S.pack=true;save();render()}else{$("err2").textContent=UI[S.lang].badCode}
    return;
  }
  var cb=e.target.closest(".cp");
  if(cb){copyLetter(cb);return}
  var c=e.target.closest(".chip");
  if(c){S[c.dataset.q]=c.dataset.v;if(c.dataset.q==="purpose"&&c.dataset.v==="family")S.stay="hosted";save();render();return}
});
document.addEventListener("change",function(e){
  if(e.target.id==="country"){S.country=e.target.value;save();render();$("country").focus();return}
  if(e.target.id==="gov"){S.gov=e.target.value;save();render();$("gov").focus();return}
  var id=e.target.dataset&&e.target.dataset.id;
  if(id){if(e.target.checked)S.done[id]=1;else delete S.done[id];save();render();
    var again=document.querySelector('input[data-id="'+id+'"]');if(again)again.focus()}
});
["fr","en","ar"].forEach(function(l){$("l-"+l).onclick=function(){S.lang=l;save();render()}});
$("reset").onclick=function(){S.done={};save();render()};
render();
})();
</script>

</body></html>
