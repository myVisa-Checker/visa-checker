<style>
/* Layout: one narrow column, phone first. Situation chips on top, sticky progress strip, checklist grouped by purpose. FR / EN / AR (RTL). */
:root{
  --bg:#ffffff; --surface:#ffffff; --ink:#14212b; --muted:#566772; --line:#e1e5e9;
  --accent:#e8590c; --accent-soft:#fdeadb; --ok:#1f7a4d; --ok-soft:#dff1e7; --on-accent:#ffffff;
  --f-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-ar:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --f-flag:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0e161c; --surface:#16222a; --ink:#e8eef2; --muted:#93a4af; --line:#2a3a44;
  --accent:#ef6a5e; --accent-soft:#3a2120; --ok:#4fc08a; --ok-soft:#173326; --on-accent:#1a0f0e; color-scheme:dark}
/* ===== Tokens (une seule source de vérité) =====
   Le mode sombre s'active avec <html data-theme="dark">. Tout nouveau style doit utiliser ces variables, jamais une couleur en dur. */
:root{
  /* couleurs d'état */
  --accent-ink:#b84a08; --accent-deep:#8f3a04; --accent-wash:#fbdcc4; --accent-2:#ff9a3c;
  --warn:#b45309; --warn-soft:#fff3d6; --warn-ink:#6b3f00;
  --rec:#1d4ed8; --rec-soft:#e3edff;
  --danger:#d92d20; --danger-hover:#b42318; --danger-text:#e5484d; --danger-soft:#fff1f1; --danger-line:#f3a6a8; --on-danger:#ffffff;
  --on-ok:#ffffff;
  /* dégradés « vedette » */
  --hot-b:#ec2d7a; --hot-c:#8b5cf6; --hot-d:#2563eb;
  /* surfaces fixes (logos, papier d'impression) */
  --logo-bg:#ffffff; --paper:#ffffff; --paper-ink:#000000;
  --blob-1:var(--accent-soft); --blob-2:#cfe6ff;
  /* ombres, voile, halos */
  --scrim:rgba(10,18,24,.55);
  --shadow-card:0 8px 24px -16px rgba(20,33,43,.25);
  --shadow-lift:0 12px 24px -12px rgba(20,33,43,.35);
  --shadow-sticky:0 8px 12px -12px rgba(0,0,0,.35);
  --shadow-pop:0 1px 4px rgba(0,0,0,.12);
  --shadow-modal:0 24px 60px -12px rgba(0,0,0,.45);
  --shadow-danger:0 10px 20px -10px rgba(217,45,32,.7);
  --ring-flag:0 0 0 1px rgba(0,0,0,.18);
  --glow-accent:rgba(232,89,12,.45); --glow-accent-0:rgba(232,89,12,0);
  --glow-violet:rgba(168,85,247,.45); --glow-violet-0:rgba(168,85,247,0);
  /* rayons et durées */
  --r-1:4px; --r-2:8px; --r-3:10px; --r-4:12px; --r-5:14px; --r-6:18px; --r-7:20px; --r-8:24px; --r-pill:999px;
  --t-fast:.15s; --t-base:.18s; --t-slow:.3s;
}
:root[data-theme="dark"]{
  --accent-ink:#f08a5d; --accent-deep:#ffb08a; --accent-wash:#4a2a24; --accent-2:#ff9a3c;
  --warn:#fbbf24; --warn-soft:#3a2c10; --warn-ink:#ffd58a;
  --rec:#8fb4ff; --rec-soft:#172a4d;
  --danger:#ff6b6f; --danger-hover:#ff8a8d; --danger-text:#ff8a8d; --danger-soft:#3a1d1f; --danger-line:#7a3a3d; --on-danger:#1a0f0e;
  --on-ok:#06261a;
  --hot-b:#ff6fa5; --hot-c:#b79bff; --hot-d:#7fa8ff;
  --blob-2:#1b3a55;
  --scrim:rgba(0,0,0,.7);
  --shadow-card:0 8px 24px -16px rgba(0,0,0,.6);
  --shadow-lift:0 12px 24px -12px rgba(0,0,0,.7);
  --shadow-sticky:0 8px 12px -12px rgba(0,0,0,.6);
  --shadow-pop:0 1px 4px rgba(0,0,0,.5);
  --shadow-modal:0 24px 60px -12px rgba(0,0,0,.8);
  --shadow-danger:0 10px 20px -10px rgba(255,107,111,.5);
  --ring-flag:0 0 0 1px rgba(255,255,255,.2);
  --glow-accent:rgba(239,106,94,.5); --glow-accent-0:rgba(239,106,94,0);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:680px;margin-inline:auto}
header{padding-block:24px 8px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;direction:ltr}
.stamp{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);
  border:2px double var(--accent);padding:4px 8px;border-radius:var(--r-1);transform:rotate(-3deg);white-space:nowrap}
.lang{display:flex;border:1px solid var(--line);border-radius:var(--r-pill);overflow:hidden;background:var(--surface)}
.lang button{border:0;background:transparent;color:var(--muted);font:500 13px var(--f-mono);padding:6px 12px;cursor:pointer;min-width:44px;min-height:32px}
.lang button#l-ar{font-family:var(--f-ar);font-size:14px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,8vw,2.9rem);line-height:1.05;margin:0;letter-spacing:-.02em;text-wrap:balance}
.sub{margin:0;color:var(--muted);max-width:56ch}
h2{font-family:var(--f-display);font-weight:600;font-size:1.15rem;margin:0;text-wrap:balance}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-3);padding:16px;display:flex;flex-direction:column;gap:16px;margin-top:16px}
.q{display:flex;flex-direction:column;gap:8px;min-width:0}
.q-label{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 14px var(--f-body);padding:8px 14px;border-radius:var(--r-pill);cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.progress{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;margin-top:8px;border-bottom:1px solid var(--line)}
.p-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.p-num{font-family:var(--f-display);font-weight:800;font-size:1.6rem;font-variant-numeric:tabular-nums}
.p-msg{font-size:14px;color:var(--muted);min-width:0}
.bar{height:8px;background:var(--line);border-radius:var(--r-pill);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width var(--t-slow)}
.bar.done i{background:var(--ok)}
section.group{margin-top:24px;display:flex;flex-direction:column;gap:10px}
.g-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.g-count{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.item{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-3);padding:12px 14px;cursor:pointer}
.item input{width:22px;height:22px;margin:2px 0 0;flex:none;accent-color:var(--ok);cursor:pointer}
.item.on{background:var(--ok-soft);border-color:var(--ok)}
.i-body{display:flex;flex-direction:column;gap:2px;min-width:0}
.i-title{font-weight:600;overflow-wrap:anywhere}
.i-note{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.tag{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);border-radius:var(--r-1);padding:1px 6px;align-self:flex-start;margin-bottom:2px}
.book{border:2px dashed var(--accent);background:var(--accent-soft);border-radius:var(--r-3);padding:14px;display:flex;flex-direction:column;gap:6px}
.book b{font-family:var(--f-display);font-size:1.05rem}
.book p{margin:0;font-size:14px}
.book .slot{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
footer{margin-top:32px;display:flex;flex-direction:column;gap:12px;font-size:13px;color:var(--ink)}
footer p{margin:0;color:var(--ink);line-height:1.55}
.links{display:flex;flex-wrap:wrap;gap:8px 16px}
.links a{color:var(--ink);font-weight:600}
.reset{align-self:flex-start;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 13px var(--f-body);padding:8px 14px;border-radius:var(--r-2);cursor:pointer;min-height:40px}
.sel{width:100%;min-height:44px;font:500 15px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--r-2);padding:8px 12px}
.agency{margin-top:32px;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-3);padding:16px}
.ag-sub,.ag-note,.ag-none{margin:0;font-size:14px;color:var(--muted)}
.partner{display:flex;flex-direction:column;gap:4px;border:1px solid var(--ok);background:var(--ok-soft);border-radius:var(--r-3);padding:12px 14px}
.partner b{font-family:var(--f-display);font-size:1.05rem}
.locked{display:flex;flex-direction:column;gap:8px;border:1px dashed var(--line);border-radius:var(--r-3);padding:12px 14px}
.locked i{display:block;height:12px;border-radius:var(--r-pill);background:var(--line)}
.locked i:last-child{width:60%}
.pay{align-self:flex-start;display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 20px;border-radius:var(--r-3);background:var(--accent);color:var(--on-accent);font:600 16px var(--f-body);text-decoration:none;border:0;cursor:pointer}
.pay.off{background:var(--line);color:var(--muted);cursor:not-allowed}
.code-row{display:flex;gap:8px;flex-wrap:wrap}
.code-row .sel{flex:1 1 140px;width:auto}
.ag-err{font-size:13px;color:var(--accent);min-height:1em}
.refus{margin-top:24px;display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-3);padding:16px}
.refus p{margin:0}
.inc,.adv{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px}
.price{font-family:var(--f-display);font-weight:800;font-size:1.25rem}
.rf-sub{font-size:14px;color:var(--muted)}
.lt{border:1px solid var(--line);border-radius:var(--r-3);background:var(--bg)}
.lt summary{padding:12px 14px;font-weight:600;cursor:pointer;min-height:44px;display:flex;align-items:center}
.lt-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
pre.letter{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;direction:ltr;text-align:left;font:14px/1.55 var(--f-body);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-2);padding:12px;user-select:text}
.cp{align-self:flex-start;border:0;background:var(--ink);color:var(--bg);font:600 14px var(--f-body);padding:10px 16px;border-radius:var(--r-2);cursor:pointer;min-height:44px}
html[lang="ar"] .price,html[lang="ar"] .lt summary,html[lang="ar"] .cp,html[lang="ar"] .refus h2{font-family:var(--f-ar)}
html[lang="ar"] .sel,html[lang="ar"] .pay,html[lang="ar"] .partner b{font-family:var(--f-ar)}
/* Arabic: RTL, Arabic faces, no letter-spacing or uppercasing (both break letter joining) */
html[lang="ar"] body,html[lang="ar"] .chip,html[lang="ar"] .reset{font-family:var(--f-ar);line-height:1.65}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] .p-num,html[lang="ar"] .book b{font-family:var(--f-ar);font-weight:700;letter-spacing:0}
html[lang="ar"] h1{line-height:1.3}
html[lang="ar"] .stamp,html[lang="ar"] .q-label,html[lang="ar"] .tag,html[lang="ar"] .book .slot,html[lang="ar"] .g-count{font-family:var(--f-ar);letter-spacing:0;text-transform:none}
html[lang="ar"] .stamp{font-size:13px}
html[lang="ar"] .q-label,html[lang="ar"] .book .slot{font-size:13px}

/* Identité visuelle : logo adaptatif (couleurs selon le thème, mot-symbole réduit sur petit écran) et mutatif (le symbole change selon le contexte) */
.brand{display:inline-flex;align-items:center;gap:.38em}
.logo{display:inline-flex;align-items:center;gap:.38em;color:var(--ink)}
.logo-mk{width:1.22em;height:1.22em;flex:none;display:block}
.logo-mk .g{transform-box:view-box;transform-origin:32px 32px;transition:opacity .35s ease,transform .45s cubic-bezier(.3,1.4,.5,1)}
.logo-mk .g-plane,.logo-mk .g-bed{opacity:0;transform:scale(.4) rotate(-25deg)}
.logo[data-g="plane"] .g-check,.logo[data-g="bed"] .g-check{opacity:0;transform:scale(.4) rotate(25deg)}
.logo[data-g="plane"] .g-plane,.logo[data-g="bed"] .g-bed{opacity:1;transform:none}
.logo .wm b{color:var(--accent);font-weight:inherit}
@media (max-width:340px){.logo .wm{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}}
.brand{font-family:var(--f-display);font-weight:800;font-size:clamp(1.7rem,5vw,2.2rem);line-height:1.1;letter-spacing:-.01em}
.stamp{align-self:flex-start}
h1{outline:none}
h1:focus-visible{outline:3px solid var(--accent);outline-offset:6px;border-radius:var(--r-2)}
.flag{font-family:var(--f-flag);font-size:1.6em;line-height:1;flex:none}
.fimg{display:block;width:28px;height:21px;object-fit:cover;border-radius:var(--r-1);box-shadow:var(--ring-flag)}
.pill .fimg{width:24px;height:18px}
.stepper{display:flex;flex-direction:column;gap:10px}
.st-row{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.st-num{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-pill);padding:4px 14px 4px 10px}
.st-bar{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.st-bar i{display:block;height:6px;border-radius:var(--r-pill);background:var(--line)}
.st-bar i.on{background:var(--accent)}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.fval,.fbtn{display:flex;align-items:center;gap:12px;min-height:54px;padding:8px 14px;border:1px solid var(--line);border-radius:var(--r-3);background:var(--bg);font:500 17px var(--f-body);color:var(--ink);width:100%;text-align:start}
.fbtn{cursor:pointer}
.fval.lock{color:var(--muted)}
.fname{flex:1;min-width:0;overflow-wrap:anywhere}
.chev{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;transition:transform .2s}
.fbtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.clist{list-style:none;margin:0;padding:4px;border:1px solid var(--line);border-radius:var(--r-3);background:var(--surface);display:flex;flex-direction:column;max-height:360px;overflow-y:auto}
.crow{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:6px 10px;border:0;background:transparent;color:var(--ink);font:500 16px var(--f-body);text-align:start;cursor:pointer;border-radius:var(--r-2)}
.crow[aria-current="true"]{background:var(--ok-soft)}
.crow .cn{flex:1;min-width:0}

.trd-hint{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;color:var(--accent-ink)}
.trd-hint i{font-style:normal;display:inline-block;animation:bpnBounce 1.2s ease-in-out infinite}
.trd-list .trd-card{animation:bpnCard .45s cubic-bezier(.3,1.2,.5,1) both}
.trd-km{font-size:12px;color:var(--muted);text-transform:none;letter-spacing:0;font-family:var(--f-body)}
.trd-adr{margin:0;font-size:14px;color:var(--muted)}
.trd-act{display:flex;flex-wrap:wrap;gap:8px}
.trd-act a{display:inline-flex;align-items:center;min-height:40px;padding:6px 12px;border:1px solid var(--line);border-radius:var(--r-pill);font:500 13px var(--f-body);color:var(--ink);text-decoration:none;background:var(--surface)}
.trd-act a:hover{border-color:var(--accent);color:var(--accent-ink)}
.trd-more{align-self:center}
.trd-near{align-self:center}
html[lang="ar"] .trd h2,html[lang="ar"] .trd-card{font-family:var(--f-ar)}
.avs{margin:32px auto 0;width:100%;max-width:760px;display:flex;flex-direction:column;gap:18px}
.avs[hidden]{display:none}
.rv-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px}
.avs h2{margin:0;font-family:var(--f-display);font-size:1.6rem;line-height:1.15}
.rv-sum{display:flex;align-items:center;gap:10px;font-weight:600}
.rv-stars{color:var(--accent-2);letter-spacing:2px;font-size:20px;line-height:1;white-space:nowrap}
.rv-stars i{font-style:normal;color:var(--line)}
.rv-track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px;scrollbar-width:thin}
.rv-card{flex:0 0 min(300px,82%);scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-6);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-card)}
.rv-card p{margin:0;font-size:15px;line-height:1.55;flex:1}
.rv-by{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.rv-by b{color:var(--ink)}
.rv-nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rv-nav button.rv-b{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);font-size:20px;cursor:pointer}
.rv-nav .rv-cta{margin-inline-start:auto}
.rv-nav.solo{justify-content:center}.rv-nav.solo .rv-cta{margin:0}
.rv-empty{text-align:center}.avs.empty h2{text-align:center}
.rv-empty{margin:0;color:var(--muted);font-size:15px}
html[lang="ar"] .avs h2,html[lang="ar"] .rv-card{font-family:var(--f-ar)}
.ag-card.ag-anon{grid-template-columns:1fr;text-align:center}
.ag-card.ag-anon .ag-body{align-items:center}
.srv-sub{text-align:center}
.srv-row{display:flex;flex-direction:column;align-items:center;gap:14px}
.srv-row .ag-card.ag-anon{width:100%;max-width:420px}
footer{background:#000;color:#fff;padding:24px 22px;border-radius:var(--r-6)}
footer p,footer .links a,footer .legal button,footer .legal button:hover{color:#fff}
footer .reset{background:#fff;color:#000;border-color:#fff}
#req .tiles{display:flex;flex-wrap:wrap;justify-content:center;overflow-x:visible;gap:14px;width:100%;padding-bottom:12px}
#req .tile{flex:0 0 96px}

/* Devenir partenaire : bandeau animé en haut de page */
.ptop{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 12px;padding:8px 12px;border:1px dashed var(--accent);border-radius:var(--r-pill);background:var(--accent-soft);font-size:14px}
.ptop[hidden]{display:none}
.ptop-t{color:var(--ink)}
.ptop-b{position:relative;overflow:hidden;display:inline-flex;align-items:center;min-height:40px;padding:6px 16px;border-radius:var(--r-pill);background:linear-gradient(90deg,var(--accent),var(--hot-b),var(--hot-c),var(--accent));background-size:250% 100%;color:#fff;font:700 14px var(--f-body);text-decoration:none;animation:hue 5s linear infinite,glow 2.4s ease-in-out infinite}
.ptop-b:hover{transform:translateY(-2px)}
.bpn-disc{min-height:52px;padding-inline:28px;background:linear-gradient(90deg,var(--accent),var(--hot-b),var(--hot-c));color:#fff;animation:glow 2.4s ease-in-out infinite}
html[lang="ar"] .ptop,html[lang="ar"] .ptop-b{font-family:var(--f-ar)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <span class="brand" id="brand"></span>
      <button type="button" class="home-btn" id="homeBtn" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 10v10h13V10M10 20v-6h4v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="lang" role="group" aria-label="Langue / Language / اللغة">
        <button type="button" id="l-fr" aria-pressed="true">FR</button>
        <button type="button" id="l-en" aria-pressed="false">EN</button>
        <button type="button" id="l-ar" aria-pressed="false">عربي</button>
      </div>
    </div>
    <div class="ptop" id="ptop" hidden></div>
    <div class="stepper" id="stepper" hidden></div>
    <span class="stamp" id="stamp"></span>
    <h1 id="h1" tabindex="-1"></h1>
    <p class="sub" id="sub"></p>
  </header>

  <div class="hero" id="home"></div>

  <div class="panel" id="mode"></div>

  <div class="panel" id="dest"></div>

  <div class="panel" id="panel"></div>

  <div id="evisa" hidden></div>

  <div id="req" hidden></div>

  <div id="tools" hidden></div>

  <div id="docs">
    <div class="progress" aria-live="polite">
      <div class="p-row"><span class="p-num" id="pnum"></span><span class="p-msg" id="pmsg"></span></div>
      <div class="bar" id="bar"><i id="barfill"></i></div>
    </div>
    <div id="list"></div>
  </div>

  <div id="help">
    <div class="agency" id="agency"></div>
    <div class="refus" id="refus"></div>
  </div>

  <div class="nav" id="nav"></div>

  <section class="sponsors" id="sponsors" aria-labelledby="sp-h"></section>

  <div class="dock" id="dock" hidden></div>

  <button type="button" class="totop" id="totop" aria-label="Haut de page" title="Haut de page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  <section class="bpn" id="bpn" aria-label="Bons plans" hidden></section>
  <section class="trd" id="trans" aria-label="Traducteurs assermentés" hidden></section>
  <section class="avs" id="reviews" aria-labelledby="rv-t" hidden></section>
  <footer>
    <div class="links" id="links"></div>
    <p id="disc"></p>
    <nav class="legal" id="legal"></nav>
    <button type="button" class="reset" id="reset"></button>
  </footer>
</div>
<div class="pwa" id="pwa" role="region" aria-live="polite" aria-labelledby="pwa-t" hidden>
  <img src="icons/icon-192.png" alt="" width="44" height="44">
  <div class="pwa-t"><b id="pwa-t"></b><span id="pwa-d"></span><ol class="pwa-steps" id="pwa-s" hidden></ol></div>
  <button type="button" class="pwa-go" id="pwa-go"></button>
  <button type="button" class="pwa-x" id="pwa-x"></button>
</div>
<dialog id="lg" aria-labelledby="lg-t" aria-modal="true" aria-hidden="true"><div class="lg-in"><div class="lg-top"><h2 id="lg-t"></h2><button type="button" class="lg-x" id="lg-x"></button></div><div id="lg-b"></div></div></dialog>

<script src="visa-app.js"></script>

<script src="visa-pwa.js"></script>


<style>
#vc-btn{position:fixed;inset-inline-end:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:var(--r-pill);background:var(--accent);color:var(--on-accent);border:0;box-shadow:var(--shadow-lift);z-index:50;cursor:pointer;display:flex;align-items:center;justify-content:center}
#vc-btn svg{width:30px;height:30px;color:var(--accent)}
#vc-box{position:fixed;inset-inline-end:16px;bottom:calc(150px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100vw - 32px));height:min(460px,calc(100vh - 220px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-5);box-shadow:var(--shadow-modal);display:none;flex-direction:column;overflow:hidden;z-index:50;font-family:var(--f-body)}
#vc-head{background:var(--accent);color:var(--on-accent);padding:10px 12px;display:flex;align-items:center;gap:10px}
.vc-av{width:38px;height:38px;border-radius:var(--r-pill);background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex:none}
.vc-av svg{width:26px;height:26px;color:var(--accent)}
#vc-name{font-weight:700;line-height:1.2}
#vc-on{font-size:12px;display:flex;align-items:center;gap:5px}
#vc-on::before{content:"";width:8px;height:8px;border-radius:var(--r-pill);background:var(--ok-soft);box-shadow:0 0 0 1px var(--ok)}
#vc-hello{text-align:center;font-size:13px;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--line);min-height:20px}
#vc-msgs{flex:1;overflow-y:auto;padding:10px;font-size:14px}
.vc-m{margin:6px 0;padding:8px 10px;border-radius:var(--r-3);max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.vc-u{background:var(--accent-soft);margin-inline-start:auto}
.vc-a{background:var(--line)}
#vc-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 8px}
.vc-chip{border:1px solid var(--accent);background:var(--surface);color:var(--accent-ink);border-radius:var(--r-pill);padding:6px 10px;font-size:13px;cursor:pointer;font-family:inherit}
#vc-form{display:flex;border-top:1px solid var(--line)}
#vc-in{flex:1;min-width:0;border:0;padding:12px;font-size:16px;outline:none;background:var(--surface);color:var(--ink);font-family:inherit}
#vc-send{border:0;background:var(--accent);color:var(--on-accent);padding:0 16px;cursor:pointer;font-family:inherit}
</style>
<button id="vc-btn" type="button" aria-label="Assistant"></button>
<div id="vc-box" role="dialog" aria-label="Assistant Visa Checker">
  <div id="vc-head"><span class="vc-av"></span><div><div id="vc-name">Assistant Visa Checker</div><div id="vc-on"></div></div></div>
  <div id="vc-hello" aria-hidden="true"></div>
  <div id="vc-msgs" aria-live="polite"></div>
  <div id="vc-chips"></div>
  <div id="vc-form"><input id="vc-in" maxlength="500" autocomplete="off"><button id="vc-send" type="button"></button></div>
</div>
<script src="visa-chat.js"></script>

</body></html>
